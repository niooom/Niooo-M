name: Niooo M — Web & Android Release Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: niooo-m-single-build
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        id: flutter-cache
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-cache-3.29.0-v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get

      - name: Compile Flutter Web
        run: |
          flutter build web --release --base-href / -v
          cd build/web
          zip -q -r ../../flutter-web-bundle.zip .
          cd ../..

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-bundle
          path: flutter-web-bundle.zip
          retention-days: 1

  build-android-release:
    name: Build Android Release APK & Publish Single Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-cache-3.29.0-v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Cache Pub & Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            android-gradle-cache-${{ runner.os }}-

      - name: Ensure Android Platform Scaffold, Native C++17 Engine, Chrome Custom Tabs & File Picker Permissions
        run: |
          mkdir -p /tmp/niooom_cpp_backup
          if [ -d android/app/src/main/cpp ]; then
            cp -r android/app/src/main/cpp/* /tmp/niooom_cpp_backup/
          fi
          rm -rf android
          flutter create --platforms=android --org com.niooo.m --project-name flutter_live_app .
          mkdir -p android/app/src/main/cpp
          cp -r /tmp/niooom_cpp_backup/* android/app/src/main/cpp/

          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.1.0"/g' android/settings.gradle.kts
          fi
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/g' android/settings.gradle
          fi

          # Configure android/app/build.gradle.kts with Native C++17 CMake build (-O3)
          cat << 'EOF' > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.niooo.m.flutter_live_app"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_17.toString()
              }

              defaultConfig {
                  applicationId = "com.niooo.m.flutter_live_app"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName

                  externalNativeBuild {
                      cmake {
                          cppFlags("-std=c++17 -O3 -ffast-math")
                      }
                  }
              }

              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

          # Configure AndroidManifest.xml with:
          # 1. File Manager / File Picker permissions & WAKE_LOCK / Fullscreen permissions
          # 2. Google Chrome Custom Tabs (Mini Chrome Browser) service queries
          # 3. File Picker / Chooser Intent Filters (GET_CONTENT, PICK, OPEN_DOCUMENT)
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <!-- Network, Screen WakeLock, Fullscreen, Notifications & Orientation Permissions -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <!-- File Manager / File Picker Storage & Media Permissions -->
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />

              <!-- Queries for Google Chrome Custom Tabs (Mini Chrome Browser) & Text Processing -->
              <queries>
                  <intent>
                      <action android:name="android.support.customtabs.action.CustomTabsService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="http" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT" />
                      <data android:mimeType="text/plain" />
                  </intent>
              </queries>

              <application
                  android:label="Niooo M"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:keepScreenOn="true"
                      android:screenOrientation="unspecified"
                      android:resizeableActivity="true"
                      android:supportsPictureInPicture="true"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <!-- Main App Launcher -->
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <!-- System File Picker / File Manager Chooser Integration (WhatsApp & External Apps Upload Picker) -->
                      <intent-filter android:label="Niooo M">
                          <action android:name="android.intent.action.GET_CONTENT" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.OPENABLE" />
                          <data android:mimeType="*/*" />
                      </intent-filter>

                      <intent-filter android:label="Niooo M">
                          <action android:name="android.intent.action.PICK" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.OPENABLE" />
                          <data android:mimeType="*/*" />
                      </intent-filter>

                      <intent-filter android:label="Niooo M">
                          <action android:name="android.intent.action.OPEN_DOCUMENT" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.OPENABLE" />
                          <data android:mimeType="*/*" />
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # Configure MainActivity.kt with Native C++ Engine JNI + Fullscreen, Landscape Orientation, WakeLock & Download NotificationManager MethodChannel
          MAIN_KT=$(find android/app/src/main -name "MainActivity.kt" 2>/dev/null | head -n 1 || true)
          if [ -z "$MAIN_KT" ]; then
            mkdir -p android/app/src/main/kotlin/com/niooo/m/flutter_live_app
            MAIN_KT="android/app/src/main/kotlin/com/niooo/m/flutter_live_app/MainActivity.kt"
            PKG_LINE="package com.niooo.m.flutter_live_app"
          else
            PKG_LINE=$(grep "^package " "$MAIN_KT" | head -n 1 || true)
            if [ -z "$PKG_LINE" ]; then
              PKG_LINE="package com.niooo.m.flutter_live_app"
            fi
          fi

          echo "$PKG_LINE" > "$MAIN_KT"
          cat << 'EOF' >> "$MAIN_KT"

          import android.app.DownloadManager
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ActivityInfo
          import android.database.Cursor
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.view.View
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.view.WindowManager
          import androidx.core.app.NotificationCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.niooo.m/player"
              private val DOWNLOAD_CHANNEL_ID = "niooo_m_downloads_channel"
              private var lastActiveDownloadId: Long = -1L
              private var lastBytesSample: Long = 0L
              private var lastTimeSampleMs: Long = 0L

              companion object {
                  init {
                      try {
                          System.loadLibrary("niooom_native_engine")
                      } catch (_: Throwable) {
                      }
                  }
              }

              private external fun initNativeCppEngine(): String

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  try {
                      initNativeCppEngine()
                  } catch (_: Throwable) {
                  }
                  createDownloadNotificationChannel()
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      window.attributes.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
              }

              private fun createDownloadNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      val channel = NotificationChannel(
                          DOWNLOAD_CHANNEL_ID,
                          "Niooo M Offline Downloads",
                          NotificationManager.IMPORTANCE_LOW
                      ).apply {
                          description = "Real-time movie download progress and offline completion notifications"
                          setShowBadge(true)
                      }
                      manager.createNotificationChannel(channel)
                  }
              }

              private fun showSystemDownloadNotification(
                  notificationId: Int,
                  title: String,
                  body: String,
                  progress: Int,
                  isOngoing: Boolean
              ) {
                  try {
                      val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      val intent = Intent(this, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      }
                      val pendingFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      } else {
                          PendingIntent.FLAG_UPDATE_CURRENT
                      }
                      val pendingIntent = PendingIntent.getActivity(this, notificationId, intent, pendingFlags)

                      val iconRes = if (isOngoing) {
                          android.R.drawable.stat_sys_download
                      } else {
                          android.R.drawable.stat_sys_download_done
                      }

                      val builder = NotificationCompat.Builder(this, DOWNLOAD_CHANNEL_ID)
                          .setSmallIcon(iconRes)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setContentIntent(pendingIntent)
                          .setOnlyAlertOnce(true)
                          .setOngoing(isOngoing)
                          .setAutoCancel(!isOngoing)
                          .setPriority(NotificationCompat.PRIORITY_LOW)

                      if (isOngoing) {
                          builder.setProgress(100, progress.coerceIn(0, 100), false)
                      } else {
                          builder.setProgress(0, 0, false)
                      }

                      manager.notify(notificationId, builder.build())
                  } catch (_: Throwable) {
                  }
              }

              private fun cancelSystemDownloadNotification(notificationId: Int) {
                  try {
                      val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      manager.cancel(notificationId)
                  } catch (_: Throwable) {
                  }
              }

              private fun enqueueNativeDownload(
                  url: String,
                  title: String,
                  userAgent: String,
                  cookies: String
              ): Long? {
                  return try {
                      val dm = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                      val safeName = title.replace(Regex("[^a-zA-Z0-9._-]"), "_") + ".mp4"
                      val req = DownloadManager.Request(Uri.parse(url))
                          .setTitle(title)
                          .setDescription("Niooo M Offline Video Download")
                          .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                          .setAllowedOverMetered(true)
                          .setAllowedOverRoaming(true)
                          .setDestinationInExternalFilesDir(this, Environment.DIRECTORY_DOWNLOADS, safeName)

                      if (userAgent.isNotBlank()) {
                          req.addRequestHeader("User-Agent", userAgent)
                      }
                      if (cookies.isNotBlank()) {
                          req.addRequestHeader("Cookie", cookies)
                      }
                      req.addRequestHeader("Referer", "https://streamtape.com/")

                      val id = dm.enqueue(req)
                      lastActiveDownloadId = id
                      lastBytesSample = 0L
                      lastTimeSampleMs = System.currentTimeMillis()
                      id
                  } catch (_: Throwable) {
                      null
                  }
              }

              private fun queryActiveSystemDownload(): Map<String, Any>? {
                  try {
                      val dm = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                      val query = DownloadManager.Query()
                      if (lastActiveDownloadId > 0L) {
                          query.setFilterById(lastActiveDownloadId)
                      }
                      val cursor: Cursor = dm.query(query) ?: return null
                      cursor.use { c ->
                          if (c.moveToFirst()) {
                              val statusIdx = c.getColumnIndex(DownloadManager.COLUMN_STATUS)
                              val dlIdx = c.getColumnIndex(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR)
                              val totIdx = c.getColumnIndex(DownloadManager.COLUMN_TOTAL_SIZE_BYTES)
                              val uriIdx = c.getColumnIndex(DownloadManager.COLUMN_LOCAL_URI)

                              val rawStatus = if (statusIdx >= 0) c.getInt(statusIdx) else 0
                              val dlBytes = if (dlIdx >= 0) c.getLong(dlIdx).coerceAtLeast(0L) else 0L
                              val totBytes = if (totIdx >= 0) c.getLong(totIdx).coerceAtLeast(0L) else 0L
                              val localUriStr = if (uriIdx >= 0) (c.getString(uriIdx) ?: "") else ""
                              val localPath = if (localUriStr.startsWith("file://")) {
                                  Uri.parse(localUriStr).path ?: localUriStr
                              } else {
                                  localUriStr
                              }

                              val nowMs = System.currentTimeMillis()
                              val elapsedSec = ((nowMs - lastTimeSampleMs).coerceAtLeast(200L)) / 1000.0
                              val deltaBytes = (dlBytes - lastBytesSample).coerceAtLeast(0L)
                              val speedMbps = (deltaBytes / (1024.0 * 1024.0)) / elapsedSec
                              lastBytesSample = dlBytes
                              lastTimeSampleMs = nowMs

                              val mappedStatus = when (rawStatus) {
                                  DownloadManager.STATUS_RUNNING, DownloadManager.STATUS_PENDING -> "downloading"
                                  DownloadManager.STATUS_SUCCESSFUL -> "completed"
                                  DownloadManager.STATUS_FAILED -> "failed"
                                  else -> "idle"
                              }

                              val speedStr = if (speedMbps > 0.05) {
                                  String.format("%.1f MB/s · C++ Engine", speedMbps)
                              } else {
                                  "C++ Engine"
                              }

                              return mapOf(
                                  "status" to mappedStatus,
                                  "downloadedBytes" to dlBytes,
                                  "totalBytes" to totBytes,
                                  "localPath" to localPath,
                                  "speedLabel" to speedStr
                              )
                          }
                      }
                  } catch (_: Throwable) {
                  }
                  return null
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "enterFullscreen" -> {
                                  runOnUiThread {
                                      window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                                      window.addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN)
                                      requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                                      hideSystemUI()
                                  }
                                  result.success(true)
                              }
                              "exitFullscreen" -> {
                                  runOnUiThread {
                                      window.clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN)
                                      requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                                      showSystemUI()
                                  }
                                  result.success(true)
                              }
                              "setKeepScreenOn" -> {
                                  val enable = call.argument<Boolean>("enable") ?: true
                                  runOnUiThread {
                                      if (enable) {
                                          window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                                      } else {
                                          window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                                      }
                                  }
                                  result.success(true)
                              }
                              "boostPlayback" -> {
                                  try {
                                      val status = initNativeCppEngine()
                                      result.success(status)
                                  } catch (_: Throwable) {
                                      result.success("Fallback Mode")
                                  }
                              }
                              "showDownloadNotification" -> {
                                  val id = call.argument<Int>("id") ?: 1001
                                  val title = call.argument<String>("title") ?: "Niooo M Download"
                                  val body = call.argument<String>("body") ?: "Downloading..."
                                  val progress = call.argument<Int>("progress") ?: 0
                                  val ongoing = call.argument<Boolean>("ongoing") ?: true
                                  runOnUiThread {
                                      showSystemDownloadNotification(id, title, body, progress, ongoing)
                                  }
                                  result.success(true)
                              }
                              "cancelDownloadNotification" -> {
                                  val id = call.argument<Int>("id") ?: 1001
                                  runOnUiThread {
                                      cancelSystemDownloadNotification(id)
                                  }
                                  result.success(true)
                              }
                              "enqueueSystemDownload" -> {
                                  val url = call.argument<String>("url") ?: ""
                                  val title = call.argument<String>("title") ?: "Movie"
                                  val ua = call.argument<String>("userAgent") ?: ""
                                  val cookies = call.argument<String>("cookies") ?: ""
                                  val dlId = enqueueNativeDownload(url, title, ua, cookies)
                                  result.success(dlId)
                              }
                              "pollSystemActiveDownload" -> {
                                  val info = queryActiveSystemDownload()
                                  result.success(info)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              private fun hideSystemUI() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(false)
                      window.insetsController?.let { controller ->
                          controller.hide(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                          controller.systemBarsBehavior =
                              WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_FULLSCREEN
                      )
                  }
              }

              private fun showSystemUI() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(true)
                      window.insetsController?.show(
                          WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars()
                      )
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
                  }
              }
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ./Niooo-M-release.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: niooo-m-release-apk
          path: Niooo-M-release.apk
          retention-days: 7

      - name: Publish / Replace Single GitHub Release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          TITLE="Niooo M — Latest Android Release APK"
          NOTES="Automated Android Release APK build for **Niooo M** (Commit: \`${GITHUB_SHA::7}\`). Includes Google Chrome Custom Tabs (Mini In-App Chrome Browser) and System File Picker / Chooser Intent permissions. Every new build automatically replaces \`Niooo-M-release.apk\` in this single release."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG" -m "Latest Android Release APK"
          git push origin "$TAG" --force

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing single release '$TAG' and replacing APK..."
            gh release upload "$TAG" ./Niooo-M-release.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            echo "Creating initial single release '$TAG' with APK..."
            gh release create "$TAG" ./Niooo-M-release.apk --title "$TITLE" --notes "$NOTES" --latest
          fi

      - name: Auto-Clean Older Workflow Runs (Keep Only Current Run)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up older workflow runs so only Run #${GITHUB_RUN_ID} remains..."
          OLD_RUNS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id" || true)
          for RUN_ID in $OLD_RUNS; do
            echo "Deleting old workflow run #$RUN_ID..."
            gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID" || true
          done
